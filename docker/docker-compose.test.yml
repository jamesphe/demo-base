version: '3.8'

name: resume-system-test
services:
  k6:
    image: grafana/k6
    volumes:
      - ./tests/performance_test.js:/scripts/performance_test.js
    command: run /scripts/performance_test.js
    environment:
      - K6_VUS=20
      - K6_DURATION=1m
      - K6_BACKEND_URL=http://resume-backend:8000
      - K6_FRONTEND_URL=http://resume-frontend:80
    depends_on:
      - resume-backend
      - resume-frontend
    network_mode: "host"

  resume-backend:
    image: resume-backend
    ports:
      - "8000:8000"
    depends_on:
      - resume-db
      - resume-redis
    volumes:
      - ./backend/.env:/app/.env
      - ./backend/uploads:/app/uploads
    environment:
      - REDIS_HOST=resume-redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - TEST_MODE=true

  resume-celery-worker:
    image: resume-celery-worker 
    command: celery -A app.services.resume_queue_service worker --loglevel=info
    depends_on:
      - resume-db
      - resume-redis
    volumes:
      - ./backend/.env:/app/.env
      - ./backend/uploads:/app/uploads
    environment:
      - REDIS_HOST=resume-redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - TEST_MODE=true

  resume-frontend:
    image: resume-frontend
    ports:
      - "6110:80"
    env_file:
      - ./frontend/.env
    depends_on:
      - resume-backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    environment:
      - TEST_MODE=true

  resume-db:
    image: postgres:14
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=demo_test
    ports:
      - "5420:5432"
    volumes:
      - resume_postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  resume-redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - resume_redis_test_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  resume_postgres_test_data:
  resume_redis_test_data: 