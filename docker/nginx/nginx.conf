server {
    listen 80;
    server_name localhost;

    # 添加日志配置
    access_log /var/log/nginx/access.log combined buffer=512k flush=1m;
    error_log /var/log/nginx/error.log debug;

    # 全局 CORS 设置
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Cookie' always;
    add_header 'Access-Control-Max-Age' 1728000 always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    # 处理 OPTIONS 请求
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        # 添加API请求的详细日志
        access_log /var/log/nginx/api_access.log combined buffer=512k flush=1m;
        error_log /var/log/nginx/api_error.log debug;
        
        # 添加详细的调试信息
        add_header X-Debug-Request-URI $request_uri;
        add_header X-Debug-Request-Method $request_method;
        add_header X-Debug-Host $host;
        add_header X-Debug-Scheme $scheme;
        add_header X-Debug-Proxy-Host $proxy_host;
        add_header X-Debug-Proxy-Port $proxy_port;
        
        # 记录请求头
        add_header X-Debug-Authorization $http_authorization;
        add_header X-Debug-Cookie $http_cookie;
        
        # 记录响应头
        add_header X-Debug-Status $status;
        add_header X-Debug-Location $sent_http_location;
        
        # 确保重定向时保留端口信息
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        
        # 处理重定向
        proxy_redirect off;
        proxy_intercept_errors on;
        error_page 301 302 307 = @handle_redirect;
        
        proxy_pass http://resume-backend:8000;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location @handle_redirect {
        internal;
        proxy_pass http://resume-backend:8000$request_uri;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $host:$server_port;
    }
} 